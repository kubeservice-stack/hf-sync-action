[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-ms-sync"
version = "0.1.0"
description = "Bidirectional sync between HuggingFace and ModelScope"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.23.0",
    "modelscope>=1.16.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.65.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
