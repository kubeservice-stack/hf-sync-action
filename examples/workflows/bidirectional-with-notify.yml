# Example Workflow: External Project - Bidirectional Sync with Notifications
#
# Copy this file to your repo as: .github/workflows/sync.yml
#
# Features:
#   - Bidirectional sync
#   - DingTalk/Feishu webhook notification on completion
#   - Automatic issue creation on failure
#   - State persistence across runs

name: HF-MS Bidirectional Sync

on:
  schedule:
    - cron: '0 */4 * * *'        # Every 4 hours

  workflow_dispatch:
    inputs:
      target:
        description: 'Sync specific item by name (empty = all)'
        required: false
        default: ''
      direction:
        description: 'Override direction'
        type: choice
        options: [config, hf_to_ms, ms_to_hf, bidirectional]
        default: config
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: kubeservice-stack/hf-sync-action@v1
        id: sync
        with:
          config: config/sync_config.yaml
          direction: ${{ inputs.direction || 'config' }}
          dry_run: ${{ inputs.dry_run || 'false' }}
          target: ${{ inputs.target || '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}

      # Optional: DingTalk notification
      - name: Notify DingTalk
        if: always()
        uses: actions/github-script@v7
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.DINGTALK_WEBHOOK;
            if (!webhook) return;

            const status = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
            await fetch(webhook, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                msgtype: 'text',
                text: {
                  content: `HF-MS Sync ${status}\nRepo: ${context.repo.owner}/${context.repo.repo}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                }
              })
            });

      # Auto-create issue on failure
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Sync failure - ${new Date().toISOString().split('T')[0]}`,
                body: `The HF-MS sync workflow failed.\n\n[View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                labels: ['sync-failure']
              });
            }
