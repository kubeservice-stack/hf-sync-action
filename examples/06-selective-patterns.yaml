# Example 6: Selective File Patterns
#
# Only sync specific file types to save bandwidth.
# Use case: sync model weights but skip training checkpoints, logs, etc.

global:
  sync_direction: "hf_to_ms"
  conflict_strategy: "newer_wins"
  max_file_size_gb: 50
  max_parallel_downloads: 4

models:
  - name: "production-model"
    hf_repo_id: "my-org/production-model"
    ms_repo_id: "my-org/production-model"
    direction: "hf_to_ms"
    # Only sync inference-ready files
    include_patterns:
      - "*.safetensors"          # Model weights (preferred over .bin)
      - "config.json"            # Model config
      - "generation_config.json" # Generation config
      - "tokenizer*"             # All tokenizer files
      - "special_tokens_map.json"
      - "tokenizer_config.json"
      - "vocab*"
      - "merges.txt"
      - "README.md"
      - "LICENSE"
    exclude_patterns:
      - "*.bin"                  # Skip PyTorch format (have safetensors)
      - "*.pt"                   # Skip checkpoints
      - "*.ckpt"                 # Skip checkpoints
      - "optimizer*"             # Skip optimizer states
      - "training_*"             # Skip training artifacts
      - "logs/*"                 # Skip logs
      - "runs/*"                 # Skip tensorboard runs
      - "*.msgpack"
      - "*.h5"
    enabled: true

datasets: []
