# Example 3: Multi-Model Batch Sync
#
# Sync many models at once, each with different settings.
# Use case: ML platform team maintaining a model library on both platforms.

global:
  sync_direction: "hf_to_ms"
  conflict_strategy: "skip"   # Don't overwrite on conflict, skip
  max_file_size_gb: 100
  retry_attempts: 5
  retry_delay_seconds: 60
  max_parallel_downloads: 8
  max_parallel_uploads: 4

models:
  # LLMs
  - name: "llama-3.1-8b"
    hf_repo_id: "meta-llama/Llama-3.1-8B-Instruct"
    ms_repo_id: "library/Llama-3.1-8B-Instruct"
    direction: "hf_to_ms"
    enabled: true

  - name: "llama-3.1-70b"
    hf_repo_id: "meta-llama/Llama-3.1-70B-Instruct"
    ms_repo_id: "library/Llama-3.1-70B-Instruct"
    direction: "hf_to_ms"
    enabled: true

  - name: "qwen2.5-7b"
    hf_repo_id: "Qwen/Qwen2.5-7B-Instruct"
    ms_repo_id: "library/Qwen2.5-7B-Instruct"
    direction: "hf_to_ms"
    enabled: true

  - name: "qwen2.5-72b"
    hf_repo_id: "Qwen/Qwen2.5-72B-Instruct"
    ms_repo_id: "library/Qwen2.5-72B-Instruct"
    direction: "hf_to_ms"
    enabled: true

  # Vision models
  - name: "qwen2-vl"
    hf_repo_id: "Qwen/Qwen2-VL-7B-Instruct"
    ms_repo_id: "library/Qwen2-VL-7B-Instruct"
    direction: "hf_to_ms"
    include_patterns:
      - "*.safetensors"
      - "*.json"
      - "*.py"
      - "tokenizer*"
    enabled: true

  # Embedding models
  - name: "bge-large"
    hf_repo_id: "BAAI/bge-large-en-v1.5"
    ms_repo_id: "library/bge-large-en-v1.5"
    direction: "hf_to_ms"
    enabled: true

datasets: []
