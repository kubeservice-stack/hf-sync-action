# Example 5: Minimal External Project Config
#
# Copy this file to your own repo as config/sync_config.yaml
# and add the workflow from ../workflows/external-project.yml
#
# This is the simplest possible config for an external project
# that just wants to mirror one model from HF to MS.

global:
  sync_direction: "hf_to_ms"
  conflict_strategy: "hf_priority"

models:
  - name: "my-model"
    hf_repo_id: "YOUR_ORG/YOUR_MODEL"       # <-- Replace this
    ms_repo_id: "YOUR_ORG/YOUR_MODEL"       # <-- Replace this
    direction: "hf_to_ms"
    enabled: true

datasets: []
